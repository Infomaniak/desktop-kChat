<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <!-- Ik: default-src 'self' + explicit script/frame/connect sources — the only remote
             origins allowed here are the shared kMeet origin and official kChat tenants
             (*.kchat.infomaniak.com, plus the preprod variant in preprod builds). -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://kmeet.infomaniak.com https://kmeet.preprod.dev.infomaniak.ch https://*.kchat.infomaniak.com https://*.kchat.preprod.dev.infomaniak.ch; frame-src https://kmeet.infomaniak.com https://kmeet.preprod.dev.infomaniak.ch https://*.kchat.infomaniak.com https://*.kchat.preprod.dev.infomaniak.ch; connect-src 'self' https://kmeet.infomaniak.com https://kmeet.preprod.dev.infomaniak.ch https://*.kchat.infomaniak.com https://*.kchat.preprod.dev.infomaniak.ch; img-src https://* data:; style-src 'self' 'unsafe-inline' https://kmeet.infomaniak.com https://kmeet.preprod.dev.infomaniak.ch https://*.kchat.infomaniak.com https://*.kchat.preprod.dev.infomaniak.ch; media-src data: 'self'">
        <style>
            body {
                overflow: hidden;
                margin: 0;
                height: 100vh;
            }
        </style>
    </head>
    <body>
        <div id="app" />
    </body>
</html>
