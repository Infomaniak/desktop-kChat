name: release-mas

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

defaults:
  run:
    shell: bash

env:
  TERM: xterm
  NPM_VERSION: "12.1.0"
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  SENTRY_RELEASE: kChat@${{ github.ref_name }}
  SENTRY_ENVIRONMENT: ${{ contains(github.ref_name, '-beta') && 'beta' || contains(github.ref_name, '-rc') && 'rc' || 'production' }}

jobs:
  begin-notification:
    runs-on: ubuntu-latest
    steps:
      - name: release/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: release/notify-channel
        env:
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
        run: |
          bash scripts/kchat_notify.sh "[$GITHUB_REF_NAME] TestFlight release started from GitHub, it should take about 15 minutes to complete."

  mac-app-store-preflight:
    needs: begin-notification
    runs-on: macos-15
    env:
      MACOS_NOTIFICATION_STATE_NO_SDK_CHECK: true
      MAS_PROFILE: ${{ secrets.MM_DESKTOP_MAC_APP_STORE_MAS_PROFILE }}
      MACOS_API_KEY_ID: ${{ secrets.MM_DESKTOP_MAC_APP_STORE_MACOS_API_KEY_ID }}
      MACOS_API_KEY: ${{ secrets.MM_DESKTOP_MAC_APP_STORE_MACOS_API_KEY }}
      MACOS_API_ISSUER_ID: ${{ secrets.MM_DESKTOP_MAC_APP_STORE_MACOS_API_ISSUER_ID }}
      CSC_FOR_PULL_REQUEST: true
      CSC_KEY_PASSWORD: ${{ secrets.MM_DESKTOP_MAC_APP_STORE_CSC_KEY_PASSWORD}}
      CSC_LINK: ${{ secrets.MM_DESKTOP_MAC_APP_STORE_CSC_LINK }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: release/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: release/setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: release/install-npm-12
        run: npm install -g npm@${{ env.NPM_VERSION }}
      - name: release/install-dependencies
        run: |
          brew install yq
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          npm ci
      - name: release/copy-provisioning-profile
        run: echo $MAS_PROFILE | base64 -D > ./mas.provisionprofile
      - name: release/patch-version-number-for-MAS
        run: ./scripts/patch_mas_version.sh
      - name: release/package
        run: npm run package:mas
      - name: release/publish
        run: fastlane publish_test path:"$(find . -name \*.pkg -print -quit)"

  sentry-release:
    needs: mac-app-store-preflight
    uses: ./.github/workflows/sentry-release.yaml
    secrets: inherit

  sentry-resolve:
    # Runs even if sentry-release fails (transient sentry-cli error on a
    # beta tag: this workflow is the only resolver), but never when it was
    # skipped, and never if cancelled.
    if: ${{ !cancelled() && needs.sentry-release.result != 'skipped' }}
    needs: sentry-release
    uses: ./.github/workflows/sentry-resolve.yaml
    secrets: inherit

  end-notification:
    needs: mac-app-store-preflight
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: release/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: release/notify-channel
        env:
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
          MAS_RESULT: ${{ needs.mac-app-store-preflight.result }}
        run: |
          if [[ "$MAS_RESULT" == "success" ]]; then
            bash scripts/kchat_notify.sh "[$GITHUB_REF_NAME] TestFlight release completed! Build is now available on App Store Connect."
          else
            bash scripts/kchat_notify.sh ":warning: [$GITHUB_REF_NAME] TestFlight release FAILED (job: $MAS_RESULT). Check the workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
