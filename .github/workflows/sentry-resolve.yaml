name: sentry-resolve

on:
    workflow_call:

jobs:
    sentry-resolve:
        runs-on: ubuntu-latest
        steps:
            - name: release/checkout-repo
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 0
            - name: ci/script-tests
              run: |
                  ruby .github/scripts/test/sentry_refs_test.rb
                  ruby .github/scripts/test/sentry_resolve_test.rb
            - name: release/sentry-resolve
              # Fully fail-open: the script exits 0 in every case, the release
              # is never blocked. A WARN result posts a kChat alert.
              env:
                  SENTRY_URL: ${{ secrets.SENTRY_URL }}
                  SENTRY_ORG: sentry
                  SENTRY_PROJECT: desktop
                  SENTRY_RELEASE_PREFIX: kChat
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  GITHUB_REF_NAME: ${{ github.ref_name }}
                  GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN }}
                  REDMINE_DOMAIN: redmine.infomaniak.ch
                  REDMINE_API_KEY: ${{ secrets.REDMINE_API_KEY }}
                  RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
              run: |
                  set +e
                  OUTPUT=$(ruby .github/scripts/sentry_resolve.rb 2>&1)
                  echo "$OUTPUT"
                  if echo "$OUTPUT" | grep -q "SENTRY_RESOLVE_RESULT: WARN"; then
                      bash scripts/kchat_notify.sh "[$GITHUB_REF_NAME] Warning: sentry-resolve reported warnings (missing secrets or API errors, see logs), the release continues."
                  fi
                  exit 0
