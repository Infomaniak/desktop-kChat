name: release-kchat

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"
            - "[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
    workflow_dispatch:

env:
    SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    SENTRY_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') && format('kChat@{0}', github.ref_name) || '' }}
    SENTRY_ENVIRONMENT: ${{ github.ref_type == 'tag' && (contains(github.ref_name, '-alpha') && 'alpha' || contains(github.ref_name, '-beta') && 'beta' || 'production') || 'alpha' }}

jobs:
    begin-notification:
        runs-on: ubuntu-latest
        steps:
            - name: release/checkout-repo
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: release/notify-channel
              env:
                  RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
              run: |
                  bash scripts/kchat_notify.sh "[$GITHUB_REF_NAME] Release for desktop app started from GitHub, it should take about 30 minutes to complete."

    build-linux:
        runs-on: ubuntu-latest
        steps:
            - name: release/checkout-repo
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: release/setup-node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: "package.json"
                  cache: "npm"
                  cache-dependency-path: package-lock.json
            - name: release/install-dependencies
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  wget -qO - https://download.opensuse.org/repositories/Emulators:/Wine:/Debian/xUbuntu_22.04/Release.key | sudo apt-key add -
                  wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.20.1/yq_linux_amd64 && chmod a+x /usr/local/bin/yq
                  sudo apt-get update || true && sudo apt-get install -y ca-certificates libxtst-dev libpng++-dev jq icnsutils graphicsmagick tzdata
                  npm ci
            - name: release/update-version
              uses: ./.github/actions/version
            # - name: release/test
            #   uses: ./.github/actions/test
            - name: release/build
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  SENTRY_URL: ${{ secrets.SENTRY_URL }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
              run: |
                  mkdir -p ./build/linux
                  npm run package:linux-appImage-x64 -- --publish always
                  bash -x ./scripts/cp_artifacts.sh release ./build/linux
            - name: release/upload-build
              uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
              with:
                name: build-${{ runner.os }}
                path: ./build
                compression-level: 0
                retention-days: 14

    build-linux-arm:
        runs-on: ubuntu-22.04-arm
        steps:
            - name: release/checkout-repo
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: release/setup-node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: "package.json"
                  cache: "npm"
                  cache-dependency-path: package-lock.json
            - name: release/install-dependencies
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.20.1/yq_linux_arm64 && chmod a+x /usr/local/bin/yq
                  sudo apt-get update || true && sudo apt-get install -y jq icnsutils graphicsmagick tzdata libxtst-dev libpng++-dev
                  npm ci
            - name: release/update-version
              uses: ./.github/actions/version
            - name: release/build
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  SENTRY_URL: ${{ secrets.SENTRY_URL }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
              run: |
                  mkdir -p ./build/linux-arm
                  npm run package:linux-appImage-arm -- --publish always
                  bash -x ./scripts/cp_artifacts.sh release ./build/linux-arm
            - name: release/upload-build
              uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
              with:
                name: build-linux-arm
                path: ./build
                compression-level: 0
                retention-days: 14

    build-windows:
        runs-on: windows-2022
        steps:
            - name: release/checkout-repo
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: release/setup-node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "18.15.0"
            - name: release/optimize
              shell: powershell
              run: ./scripts/Makefile.ps1 optimize
            - name: release/install-deps
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              shell: powershell
              run: |
                  ./scripts/Makefile.ps1 install-deps
                  choco install yq --version 4.15.1 -y
                  npm i -g node-gyp
                  node-gyp install
                  node-gyp install --devdir="$env:USERPROFILE\.electron-gyp" --target=$(jq -r .devDependencies.electron package.json) --dist-url="https://electronjs.org/headers"
                  node-gyp install --devdir="$env:USERPROFILE\.electron-gyp" --target=$(jq -r .devDependencies.electron package.json) --dist-url="https://electronjs.org/headers" --arch arm64
                  npm ci --openssl_fips=''
            - name: release/update-version
              uses: ./.github/actions/version
            - name: release/build-nsis
              shell: powershell
              env:
                  MM_WIN_INSTALLERS: 1
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  SM_API_KEY: ${{ secrets.SM_API_KEY }}
                  SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
                  SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
                  SM_HOST: ${{ secrets.SM_HOST }}
                  SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
                  SM_KEYPAIR_ALIAS: ${{ secrets.SM_KEYPAIR_ALIAS }}
                  SM_TOOLS_URI: ${{ secrets.SM_TOOLS_URI }}
                  SM_CLIENT_CERT_FILE: ${{ secrets.SM_CLIENT_CERT_FILE }}
                  SENTRY_URL: ${{ secrets.SENTRY_URL }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
              run: |
                  ./scripts/setup-keylocker.ps1
                  ./scripts/Makefile.ps1 build-nsis
            - name: release/package-nsis
              run: |
                mkdir -p ./build/win-release
                bash -x ./scripts/cp_artifacts.sh release ./build/win-release
            - name: release/clean-release
              shell: powershell
              run: Remove-Item release\* -Recurse -Force -ErrorAction SilentlyContinue
            - name: release/build-msi
              shell: powershell
              env:
                  MM_WIN_INSTALLERS: 1
                  SM_API_KEY: ${{ secrets.SM_API_KEY }}
                  SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
                  SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
                  SM_HOST: ${{ secrets.SM_HOST }}
                  SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
                  SM_KEYPAIR_ALIAS: ${{ secrets.SM_KEYPAIR_ALIAS }}
                  SM_TOOLS_URI: ${{ secrets.SM_TOOLS_URI }}
                  SM_CLIENT_CERT_FILE: ${{ secrets.SM_CLIENT_CERT_FILE }}
                  SENTRY_URL: ${{ secrets.SENTRY_URL }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
              run: |
                  ./scripts/Makefile.ps1 build-msi
            - name: release/package-msi
              run: |
                mkdir -p ./build/win-msi
                bash -x ./scripts/cp_artifacts.sh release ./build/win-msi
            - name: release/upload-build
              uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
              with:
                name: build-${{ runner.os }}
                path: ./build
                compression-level: 0
                retention-days: 14

    sentry-release:
        if: startsWith(github.ref, 'refs/tags/')
        needs:
            - build-linux
            - build-linux-arm
            - build-windows
        uses: ./.github/workflows/sentry-release.yaml
        secrets: inherit

    github-release:
      runs-on: ubuntu-22.04
      needs:
        - build-windows
        - build-linux
        - build-linux-arm
      steps:
        - name: release/checkout-repo
          uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

        - name: release/download-builds
          uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4.1.4
          with:
            path: build
            pattern: build-*
            merge-multiple: true

        - name: release/setup-files-for-github-release
          # find ./build/{macos-release,win-release,linux} -type f -exec cp --backup=numbered -t ./ghr-dist {} +
          run: |
            mkdir -p ./ghr-dist
            find ./build/win-release ./build/win-msi ./build/linux ./build/linux-arm -type f -exec cp --backup=numbered -t ./ghr-dist {} +

        - name: release/publish-release
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            VERSION="${GITHUB_REF_NAME}"
            RELEASE_TITLE="v${VERSION} ($(date -u "+%Y-%m-%d"))"
            [[ $VERSION =~ "-beta" ]] || [[ $VERSION =~ "-alpha" ]] && PRERELEASE="--prerelease"
            gh release create --draft ${PRERELEASE} --verify-tag --target "${GITHUB_SHA}" --title "${RELEASE_TITLE}" "${GITHUB_REF_NAME}" ./ghr-dist/*

    end-notification:
        runs-on: ubuntu-latest
        needs:
            - begin-notification
            - build-linux
            - build-linux-arm
            - build-windows
            - github-release
            - sentry-release
        if: always()
        steps:
            - name: release/checkout-repo
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 0
            - name: release/notify-channel
              env:
                  RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
                  VERSION: ${{ github.ref_name }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  BUILD_LINUX_RESULT: ${{ needs.build-linux.result }}
                  BUILD_LINUX_ARM_RESULT: ${{ needs.build-linux-arm.result }}
                  BUILD_WINDOWS_RESULT: ${{ needs.build-windows.result }}
                  GITHUB_RELEASE_RESULT: ${{ needs.github-release.result }}
                  SENTRY_RELEASE_RESULT: ${{ needs.sentry-release.result }}
              run: |
                  bash scripts/kchat_notify.sh "$(bash -x scripts/generate_release_post.sh)"
