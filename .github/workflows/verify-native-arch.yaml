name: verify-native-arch

# Free (signature-less) validation of the native architecture gate on a real
# Windows runner: npm ci, unsigned zip+msi builds for x64 and arm64, with the
# afterPack gate active on every pass.
on:
    workflow_dispatch:
    push:
        paths:
            - ".github/workflows/verify-native-arch.yaml"

jobs:
    verify-windows:
        runs-on: windows-2022
        steps:
            - name: verify/checkout-repo
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: verify/setup-node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"
                  cache-dependency-path: package-lock.json
            - name: verify/install-npm-12
              shell: powershell
              run: |
                  npm install -g npm@12.1.0
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  Add-Content $env:GITHUB_PATH ((npm config get prefix).Trim())
            - name: verify/install-deps
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              shell: powershell
              run: |
                  npm i -g node-gyp
                  node-gyp install
                  node-gyp install --devdir="$env:USERPROFILE\.electron-gyp" --target=$(jq -r .devDependencies.electron package.json) --dist-url="https://electronjs.org/headers"
                  node-gyp install --devdir="$env:USERPROFILE\.electron-gyp" --target=$(jq -r .devDependencies.electron package.json) --dist-url="https://electronjs.org/headers" --arch arm64
                  npm ci
            - name: verify/patch-applied
              shell: bash
              run: |
                  if [ -f node_modules/@jitsi/robotjs/binding.gyp ]; then echo "ERROR: robotjs binding.gyp still present" && exit 1; fi
                  echo "robotjs binding.gyp removed: OK"
                  node -e "console.log('gypfile =', require('./node_modules/@jitsi/robotjs/package.json').gypfile)"
            - name: verify/build
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  SENTRY_URL: ${{ secrets.SENTRY_URL }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
              shell: powershell
              run: |
                  npm version 3.5.3-rc.1 --no-git-tag-version --allow-same-version
                  npm run build-prod
                  node node_modules\electron-builder\cli.js --win zip msi --x64 --arm64 --publish=never --config.win.forceCodeSigning=false --config.win.sign=scripts/nosign.js
            - name: verify/gate-green
              shell: bash
              run: |
                  node scripts/verify-native-arch.js release/win-arm64-unpacked arm64
                  node scripts/verify-native-arch.js release/win-unpacked x64
            - name: verify/upload-artifacts
              uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
              with:
                  name: unsigned-build
                  path: |
                      release/*.zip
                      release/*.msi
                  compression-level: 0
                  retention-days: 7
